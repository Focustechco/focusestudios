services:
  - type: web
    name: focus-publisher
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPERATION_MODE
        value: DIRECT_POST
      - key: APP_ENV
        value: production
      - key: TIMEZONE
        value: America/Fortaleza
